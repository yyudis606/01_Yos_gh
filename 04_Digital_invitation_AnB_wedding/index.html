<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan | Batman & Batgirl</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --ink: #171b1a; --paper: #f5f1e9; --gold: #b78b4a; --muted: #66706b; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      background: #d8ddd5;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: var(--paper);
      border: 1px solid rgba(23,27,26,.12);
      padding: 44px 34px;
      border-radius: 4px;
      text-align: center;
      box-shadow: 14px 16px 0 rgba(23,27,26,.08);
    }

    h2 {
      margin-bottom: 10px;
      font: 600 clamp(2rem, 8vw, 3.4rem)/1.05 'Playfair Display', serif;
      color: var(--ink);
    }

    p.small {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px 16px;
      border-radius: 2px;
      border: 1px solid rgba(23,27,26,.2);
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      font-weight: 600;
    }

    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(23,27,26,.22);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Masukkan Nama Anda</h2>
    <p class="small">Nama akan diteruskan ke halaman undangan utama.</p>

    <input id="guestInput" placeholder="Masukkan nama Anda" autocomplete="off" />

    <button class="btn btn-primary" id="goBtn">Buka Undangan</button>
    <button class="btn btn-secondary" id="resetBtn">Reset</button>

    <p class="small">
      Atau <a href="invitation.html">buka undangan</a> langsung (tanpa nama).
    </p>
  </div>

  <script>
    const input = document.getElementById('guestInput');
    const goBtn = document.getElementById('goBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Prefill jika ada data tersimpan
    const stored = localStorage.getItem('invitationGuest');
    if (stored) input.value = stored;

    goBtn.addEventListener('click', () => {
      const name = input.value.trim();

      if (!name) {
        alert("Masukkan nama terlebih dahulu");
        return;
      }

      localStorage.setItem('invitationGuest', name);

      const url = "invitation.html?guest=" + encodeURIComponent(name);
      window.location.href = url;
    });

    resetBtn.addEventListener('click', () => {
      input.value = "";
      localStorage.removeItem('invitationGuest');
    });

    // Enter = klik tombol
    input.addEventListener('keydown', e => {
      if (e.key === "Enter") goBtn.click();
    });
  </script>
</body>
</html>
